openapi: 3.0.3
info:
  title: Wavvon Hub API
  version: "1.0"
  description: |
    REST + WebSocket API for a Wavvon hub server. This file is the
    protocol contract — implement a client in any language against
    this spec without reading Rust source.

    ## Authentication

    All endpoints (except `/health`, `/info`, `/auth/*`, `/join/:code`)
    require a Bearer token obtained from `POST /auth/verify`.

    ### Auth flow

    1. `POST /auth/challenge` with your hex-encoded Ed25519 public key.
    2. Sign the returned `challenge` with your Ed25519 private key.
       - The challenge is hex: hex-decode it to its 32 bytes first.
       - If the response carries `scheme: "tagged-v1"`, sign
         `b"wavvon/auth-challenge/v1\0" || challenge_bytes` (wire-format.md).
         With no `scheme`, sign the raw 32 bytes. Refuse an unknown scheme.
       - Encode the 64-byte signature as lowercase hex.
    3. `POST /auth/verify` with your public key, the challenge, and the hex signature.
       - Optionally include a `security_nonce` + `security_level` for PoW (see below).
    4. On success, receive a `token`. Send it as `Authorization: Bearer <token>` on all
       subsequent requests.

    ### Proof-of-Work (PoW)

    Some hubs require callers to prove a security level before granting membership.
    The algorithm:

    ```
    hash = SHA256(utf8(public_key_hex) || little_endian_u64(nonce))
    level = number of leading zero BITS in hash
    ```

    To reach level N, iterate nonces starting from 1 until a hash with ≥ N leading
    zero bits is found. Level 0 = no work required. Level 20 takes ~1M hashes on average.

    Submit `security_nonce` (the winning nonce as a u64) and `security_level` (the
    claimed level) in `POST /auth/verify`. The hub verifies independently.

    ### Session scope

    `POST /auth/verify` returns a `scope` field:
    - `"member"` — full access.
    - `"lobby"` — hub has a security lobby and your PoW level is below the minimum.
      You can only call `/lobby/*` endpoints until promoted.

    ## Programs

    There is no separate authentication for a program. It holds a keypair,
    answers the same challenge, carries the same session token, and is bound by
    the same permissions. A member running one holds `apps.register`, which is
    what `/me/app/*` and the message shapes an app authors are gated on.

    ## WebSocket protocol

    All realtime traffic (chat events, typing, DMs, voice presence, proximity
    voice zones, video and screen-share WebRTC signaling, screen-share chunk
    relay, forum/poll/pin events, and hub-event push) runs
    over a single WebSocket at `GET /ws`.

    - **Connect:** `GET /ws?token=<token>` — the token goes in the **`token`
      query parameter**, not a header. It is the session token from
      `POST /auth/verify` (a program uses the same kind), with the same
      expiry / revocation / approval / ban checks as REST.
    - **Framing:** every protocol message is a JSON text frame with a `type`
      discriminator and the payload fields at the same level
      (e.g. `{"type":"subscribe","channel_id":"..."}`). Binary frames are used
      only for screen-share chunk data and are always preceded by a
      `screen_share_chunk` JSON envelope.
    - **On connect** the hub sends `{"type":"hello","live_seq":<n>}`,
      auto-subscribes the connection to every non-banned channel, and replays
      `screen_share_started` for shares already in progress.
    - Unknown or malformed client frames are silently ignored; recoverable
      command failures come back as `{"type":"error","context":...,"message":...}`.

    OpenAPI 3.0 cannot model WebSocket messages natively, so the **complete
    message-by-message wire reference** (client→server and server→client
    messages, including the app-only pushes, with exact field names and
    types) lives in [`docs/ws-protocol.md`](docs/ws-protocol.md). That file
    is part of this protocol contract: implement the WS side against it.

servers:
  - url: http://localhost:3000
    description: Local development hub

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    SignedMemberChange:
      type: object
      description: >-
        The actor's signature over a group add or leave (wire-format.md, "Group DM member change").
        Without it the change holds on this hub only; with it the hub carries the change to the
        other members' hubs. Only on a hub advertising `dms.group.signedmembers`.
      required: [issued_at, signature]
      properties:
        issued_at: { type: integer, format: int64, description: unix seconds }
        signature: { type: string }
        signer_cert:
          allOf: [{ $ref: '#/components/schemas/SubkeyCert' }]
          description: When the signing key is not the actor's own, the master-signed cert tying the two.
    UserInfo:
      type: object
      description: A member as listed by `GET /users`.
      required: [public_key, display_name, avatar, online, group_role, birthday, name_color]
      properties:
        public_key: { type: string }
        display_name: { type: string, nullable: true }
        avatar: { type: string, nullable: true, description: "Base64-encoded image" }
        online: { type: boolean }
        status: { type: string, description: Presence status. Omitted unless set. }
        status_custom: { type: string, description: Custom status text. Omitted unless set. }
        group_role: { type: string, nullable: true }
        birthday: { type: string, nullable: true }
        name_color: { type: string, nullable: true }

    MemberAdminInfo:
      type: object
      description: A member as listed for administrators by `GET /hub/members`.
      required: [public_key, display_name, online, first_seen_at, last_seen_at, roles, birthday]
      properties:
        public_key: { type: string }
        display_name: { type: string, nullable: true }
        online: { type: boolean }
        first_seen_at: { type: integer, format: int64 }
        last_seen_at: { type: integer, format: int64 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        birthday: { type: string, nullable: true }

    Channel:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        created_by: { type: string }
        parent_id: { type: string, nullable: true }
        is_category: { type: boolean }
        display_order: { type: integer, format: int64 }
        description: { type: string, nullable: true }
        icon: { type: string, nullable: true }
        color: { type: string, nullable: true }
        custom_icon_svg: { type: string, nullable: true }
        created_at: { type: integer, format: int64, description: "Unix timestamp" }
        channel_type:
          type: string
          description: >-
            `text`, `voice`, `forum`, `banner` or `spawner`. Always `text` for
            categories. On hubs with the `channels.voice` capability only a
            `voice` channel can be joined for voice; it has a chat as well, and
            a spawner's rooms are `voice`.
        banner_url: { type: string, description: Omitted unless set }
        banner_file_id: { type: string, description: Omitted unless set }
        is_temporary:
          type: boolean
          description: True for a join-to-create room spawned from a spawner channel.
        owner_pubkey:
          type: string
          description: Temp channels only (omitted otherwise) — the joiner who owns the room.
        spawner_name_template:
          type: string
          description: Spawner channels only (omitted otherwise) — the name template for spawned rooms.
        event_id:
          type: string
          description: Auto-spawned squad rooms only (omitted otherwise) — the event the room was made for.
        forum_require_tag:
          type: boolean
          description: Forum channels — posts must carry at least one tag. Always false elsewhere.
        nsfw: { type: boolean, description: NSFW flag for this channel specifically }
        can_move_members:
          type: boolean
          description: >-
            The caller's own `voice.move_members` on this channel, resolved
            channel-scoped, so a move-destination picker can offer only the
            channels that will accept the move (events.md §7.1). Advertised
            as the `channels.move.targets` capability; absent on hubs that
            do not advertise it, which is not the same as `false`.

    Message:
      type: object
      properties:
        id: { type: string }
        channel_id: { type: string }
        sender: { type: string }
        sender_name: { type: string, nullable: true }
        content: { type: string }
        created_at: { type: integer, format: int64 }
        edited_at: { type: integer, format: int64, nullable: true }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        reactions:
          type: array
          items: { $ref: '#/components/schemas/Reaction' }
        reply_to:
          nullable: true
          anyOf: [{ $ref: '#/components/schemas/ReplyContext' }]
        visible_to_pubkey:
          type: string
          description: >-
            Omitted unless set. When present, only the named user should see
            this message (ephemeral bot replies).
        reply_count:
          type: integer
          format: int64
          description: Number of direct replies; non-zero only on thread roots.
        embeds:
          type: array
          items: { $ref: '#/components/schemas/Embed' }
          description: Omitted unless set. Rich embeds authored by an app (docs/apps.md).
        game:
          allOf: [{ $ref: '#/components/schemas/GameLaunchCard' }]
          description: Omitted unless set. Game-modal launch card authored by an app (docs/apps.md).
        components:
          type: array
          items: { $ref: '#/components/schemas/ComponentRow' }
          description: Omitted unless set. Buttons and selects authored by an app; a click is sent back as `component_interaction` (docs/apps.md).

    HubEvent:
      type: object
      description: One envelope for live push, replay, polling and outgoing webhooks (docs/apps.md).
      required: [type, seq, event, hub_url, at, payload]
      properties:
        type: { type: string, enum: [hub_event] }
        seq: { type: integer, format: int64 }
        event: { type: string, example: member.joined }
        hub_url: { type: string }
        at: { type: integer, format: int64, description: Unix seconds }
        payload: { type: object, additionalProperties: true }
        actor_pubkey: { type: string }
        target_pubkey: { type: string }
        channel_id: { type: string }
        replayed: { type: boolean, description: Set on events read back from the audit log (Resume and polling). }
        webhook_id: { type: string, description: Outgoing webhooks only. }
        truncated: { type: boolean, description: "Outgoing webhooks only, when the payload was cut to the size cap." }

    ComponentRow:
      type: object
      required: [type, components]
      properties:
        type: { type: string, enum: [row] }
        components:
          type: array
          items: { $ref: '#/components/schemas/MessageComponent' }

    MessageComponent:
      type: object
      required: [type, custom_id]
      properties:
        type: { type: string, enum: [button, select] }
        custom_id: { type: string }
        label: { type: string }
        style: { type: string }
        disabled: { type: boolean }
        placeholder: { type: string }
        min_values: { type: integer, format: int64 }
        max_values: { type: integer, format: int64 }
        options:
          type: array
          items: { $ref: '#/components/schemas/SelectOption' }

    SelectOption:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: string }
        description: { type: string }

    Attachment:
      type: object
      required: [name, mime, data_b64]
      properties:
        name: { type: string }
        mime: { type: string }
        data_b64: { type: string }

    Reaction:
      type: object
      properties:
        emoji: { type: string }
        count: { type: integer, format: int64 }
        me: { type: boolean }

    ReplyContext:
      type: object
      properties:
        message_id: { type: string }
        sender: { type: string }
        sender_name: { type: string, nullable: true }
        content_preview: { type: string }

    Role:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        permissions: { type: array, items: { type: string } }
        priority: { type: integer, format: int64 }
        display_separately: { type: boolean }
        created_at: { type: integer, format: int64 }
        color: { type: string, nullable: true }
        icon: { type: string, nullable: true }
        category_id: { type: string, nullable: true }

    RoleCategory:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        color: { type: string, nullable: true }
        icon: { type: string, nullable: true }
        position: { type: integer, format: int64 }
        created_at: { type: integer, format: int64 }

    Invite:
      type: object
      properties:
        code: { type: string }
        created_by: { type: string }
        max_uses: { type: integer, format: int64, nullable: true }
        uses: { type: integer, format: int64 }
        expires_at: { type: integer, format: int64, nullable: true }
        created_at: { type: integer, format: int64 }
        grant_role_id: { type: string, nullable: true, description: Role granted on redemption besides everyone }
        bound_pubkey:
          type: string
          nullable: true
          description: >-
            The one identity this invite admits, or null for a bearer code.
            Advertised as the `invites.bound` capability.
        status:
          type: string
          enum: [live, expired, used_up]
          description: >-
            Whether this invite can still admit anyone, and if not, which of
            the two ways it retired. Advertised as the `invites.status`
            capability; absent on hubs that do not advertise it.

    HubInfo:
      type: object
      description: |
        `GET /info`. Additive by rule: ignore fields you do not recognise.
      required:
        - name
        - description
        - icon
        - version
        - capabilities
        - public_key
        - min_security_level
        - min_pow_level
        - invite_only
        - challenge_mode
        - self_tags
        - nsfw
        - badges
        - emoji_count
        - lan_mode
        - birthdays_enabled
        - max_attachment_bytes
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        icon: { type: string, nullable: true }
        public_key:
          type: string
          description: The hub's Ed25519 identity, hex. This is the hub's ID.
        version:
          type: string
          description: |
            For display and "this hub is very old" warnings **only**. Never
            decide whether a feature exists by comparing this — use
            `capabilities`.
        capabilities:
          type: array
          items: { type: string }
          description: |
            What this hub can do, e.g. `voice.wt`, `list.cursor`. Test
            membership to decide what to offer; absent or empty means a hub
            predating capability advertising, which reads correctly as "knows
            nothing". The list only ever grows — a string never changes
            spelling or meaning once published.
          example: [list.cursor, pairing.subkey, recovery.attestation, screenshare.v2, voice.wt]
        canonical_url:
          type: string
          description: |
            The address this hub says clients should use for it. Behind a farm
            this is the hub's owner-chosen name (`https://farm.example/hub/
            MangiaDaPippo`) and it **changes** when the hub is renamed —
            re-read it whenever you refresh `/info` and update the address you
            have stored.

            Following it is safe because a hub is identified by `public_key`,
            never by its address: you change *where* you look, not who you
            believe you are talking to. Absent when the hub has no public
            address.
        invite_only: { type: boolean }
        min_security_level: { type: integer }
        min_pow_level: { type: integer }
        challenge_mode: { type: string, enum: [off, click, puzzle, both] }
        farm_url:
          type: string
          description: When present, send `/auth/*` here instead of to the hub. Omitted unless set.
        self_tags: { type: array, items: { type: string } }
        nsfw: { type: boolean }
        badges:
          type: array
          description: Badges other hubs issued to this hub.
          items:
            type: object
            required: [payload, signature]
            properties:
              payload: { $ref: '#/components/schemas/BadgePayload' }
              signature: { type: string }
        cert_requirement:
          type: object
          description: What a certificate must show to admit a member. Omitted unless set.
          required: [mode, trusted_issuers, require]
          properties:
            mode: { type: string }
            trusted_issuers: { type: array, items: { type: string } }
            require:
              type: object
              required: [min_pow_level, min_member_since_days]
              properties:
                min_pow_level: { type: integer, nullable: true }
                min_member_since_days: { type: integer, nullable: true }
        sfu_url: { type: string, description: Omitted unless the hub runs an SFU. }
        emoji_count: { type: integer, format: int64 }
        rotation:
          type: object
          description: Hub key rotation payload during the transition window after a rotate-key ceremony (see `GET /key-rotation`). Omitted when no rotation is in progress.
        lan_mode: { type: boolean }
        lan_tls: { type: string, description: Omitted unless set. }
        lan_fingerprint: { type: string, description: Omitted unless set. }
        welcome_label: { type: string, description: Omitted unless set. }
        welcome_invite_url: { type: string, description: Omitted unless set. }
        farewell_label: { type: string, description: Omitted unless set. }
        voice_wt_url: { type: string, description: WebTransport voice endpoint. Omitted unless set. }
        voice_cert_hash: { type: string, description: Omitted unless set. }
        timezone: { type: string, description: Omitted unless set. }
        birthdays_enabled: { type: boolean }
        max_attachment_bytes: { type: integer, format: int64 }

    MeInfo:
      type: object
      required:
        - public_key
        - display_name
        - avatar
        - bio
        - pronouns
        - status_message
        - activities
        - accent_color
        - cover
        - favorite_hubs
        - show_hubs
        - findable_by_allies
        - approval_status
        - roles
        - birthday
        - name_color
      properties:
        public_key: { type: string }
        display_name: { type: string, nullable: true }
        avatar: { type: string, nullable: true }
        bio: { type: string, nullable: true }
        pronouns: { type: string, nullable: true }
        status_message: { type: string, nullable: true }
        activities: { type: string, nullable: true }
        accent_color: { type: string, nullable: true }
        cover: { type: string, nullable: true }
        favorite_hubs:
          type: array
          items:
            type: object
            required: [url, name, icon]
            properties:
              url: { type: string }
              name: { type: string }
              icon: { type: string, nullable: true }
        show_hubs: { type: boolean }
        findable_by_allies: { type: boolean }
        approval_status: { type: string, enum: [approved, pending] }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        birthday: { type: string, nullable: true }
        name_color: { type: string, nullable: true }

    DmMessage:
      type: object
      required: [id, conversation_id, sender, sender_name, content, created_at, attachments, delivery_failed, is_encrypted, encrypted_envelope, group_encrypted_envelope]
      properties:
        id: { type: string }
        conversation_id: { type: string }
        sender: { type: string }
        sender_name: { type: string, nullable: true }
        content: { type: string, nullable: true }
        created_at: { type: integer, format: int64 }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        delivery_failed: { type: boolean }
        is_encrypted: { type: boolean }
        encrypted_envelope:
          type: object
          nullable: true
          description: 1-on-1 encrypted envelope (docs/wire-format.md).
          required: [sender_pubkey, conv_id, ciphertext_hex, nonce_hex, dh_pubkey_hex, signature_hex, v]
          properties:
            sender_pubkey: { type: string }
            conv_id: { type: string }
            ciphertext_hex: { type: string }
            nonce_hex: { type: string }
            dh_pubkey_hex: { type: string }
            signature_hex: { type: string }
            v: { type: integer }
            message_index: { type: integer, description: Omitted unless set. }
            prev_count: { type: integer, description: Omitted unless set. }
            signer_cert: { type: object, description: Device subkey cert when a subkey signed. Omitted unless set. }
        group_encrypted_envelope:
          type: object
          nullable: true
          description: Group sender-key envelope (docs/wire-format.md).
          required: [sender_pubkey, conv_id, sender_key_version, iteration, ciphertext_hex, nonce_hex, signature_hex]
          properties:
            sender_pubkey: { type: string }
            conv_id: { type: string }
            sender_key_version: { type: integer }
            iteration: { type: integer }
            ciphertext_hex: { type: string }
            nonce_hex: { type: string }
            signature_hex: { type: string }
            signer_cert: { type: object, description: Device subkey cert when a subkey signed. Omitted unless set. }

    Conversation:
      type: object
      properties:
        id: { type: string }
        conv_type: { type: string }
        members: { type: array, items: { type: string } }
        created_at: { type: integer, format: int64 }
        last_activity_at: { type: integer, format: int64 }

    AppRegistration:
      type: object
      description: >-
        The caller's own app profile and slash commands (GET /me/app,
        PUT /me/app/profile). Optional fields are omitted when unset, never null.
      required: [pubkey, name, commands]
      properties:
        pubkey: { type: string }
        name: { type: string }
        avatar_url: { type: string }
        description: { type: string }
        webhook_url: { type: string }
        homepage_url: { type: string }
        commands:
          type: array
          items:
            type: object
            required: [name, description]
            properties:
              name: { type: string }
              description: { type: string }
              args: { type: string }
              scope: { type: string }
              privileged: { type: boolean }
              cooldown_seconds: { type: integer, format: int64 }

    LobbyStatus:
      type: object
      properties:
        status: { type: string, enum: [lobby, promoted, member] }
        required_level: { type: integer }
        current_level: { type: integer }
        entered_at: { type: integer, format: int64, nullable: true }
        welcome_md: { type: string, nullable: true }

    ChallengePrompt:
      type: object
      properties:
        id: { type: string }
        mode: { type: string, enum: [click, puzzle, both] }
        prompt_svg: { type: string, nullable: true, description: "SVG puzzle image, present when mode includes puzzle" }
        expires_at: { type: integer, format: int64 }

    AllianceInfo:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        created_by: { type: string }
        created_at: { type: integer, format: int64 }

    BadgePayload:
      type: object
      description: Canonical badge payload signed by the issuing hub.
      properties:
        issuer_pubkey: { type: string }
        issuer_url: { type: string }
        subject_pubkey: { type: string }
        label: { type: string }
        issued_at: { type: string, description: "ISO-8601 timestamp" }
        expires_at: { type: string, nullable: true }

    CertPayload:
      type: object
      description: Canonical certification payload signed by the issuing hub.
      properties:
        subject_kind: { type: string, description: "Always 'user'" }
        issuer_pubkey: { type: string }
        issuer_url: { type: string }
        subject_pubkey: { type: string }
        member_since: { type: integer, format: int64 }
        standing: { type: string, enum: [good, revoked] }
        pow_level: { type: integer, nullable: true }
        issued_at: { type: integer, format: int64 }
        expires_at: { type: integer, format: int64 }
        capabilities: { type: array, items: { type: string } }
        label:
          type: string
          description: Badge display name; present means this cert is an achievement badge. Omitted unless set.
        description: { type: string, description: Omitted unless set. }
        icon: { type: string, description: Emoji or short icon for the badge. Omitted unless set. }

    Certification:
      type: object
      description: "Certification envelope (payload + hex Ed25519 hub signature)."
      required: [payload, signature]
      properties:
        payload: { $ref: '#/components/schemas/CertPayload' }
        signature: { type: string }

    PostSummary:
      type: object
      properties:
        id: { type: string }
        channel_id: { type: string }
        author_pubkey: { type: string, nullable: true, description: "Null on tombstoned posts for non-moderators" }
        title: { type: string, nullable: true }
        created_at: { type: integer, format: int64 }
        edited_at: { type: integer, format: int64, description: "Omitted when never edited" }
        is_pinned: { type: boolean }
        is_locked: { type: boolean }
        reply_count: { type: integer, format: int64 }
        last_activity_at: { type: integer, format: int64 }
        is_deleted: { type: boolean }
        unread_reply_count:
          type: integer
          format: int64
          description: Replies after the viewer's read cursor. Omitted when unauthenticated.
        reactions:
          type: array
          items: { $ref: '#/components/schemas/Reaction' }
        attachments:
          type: array
          items:
            type: object
            required: [url, name, mime, size]
            properties:
              url: { type: string }
              name: { type: string }
              mime: { type: string }
              size: { type: integer, format: int64 }
        author_hub:
          type: string
          description: >-
            Origin hub public key (hex) when the post came in through the
            alliance forum write-proxy. Hub-asserted, not proven: render it as
            mediated ("via HubName"). Omitted for local posts.
        tags:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string }
              label: { type: string }
              color: { type: string, description: Omitted unless set. }

    PostDetail:
      allOf:
        - $ref: '#/components/schemas/PostSummary'
        - type: object
          properties:
            body: { type: string, nullable: true }
            replies:
              type: array
              items: { $ref: '#/components/schemas/ReplyView' }
            reply_cursor: { type: string, description: "Omitted when there are no more replies" }

    ReplyView:
      type: object
      required: [id, post_id, author_pubkey, body, created_at, is_deleted, reactions, attachments]
      properties:
        id: { type: string }
        post_id: { type: string }
        author_pubkey: { type: string, nullable: true }
        body: { type: string, nullable: true, description: "Null on tombstoned replies" }
        created_at: { type: integer, format: int64 }
        edited_at: { type: integer, format: int64, description: "Omitted when never edited" }
        reply_to_id: { type: string, description: "Omitted on top-level replies" }
        is_deleted: { type: boolean }
        reactions:
          type: array
          items: { $ref: '#/components/schemas/Reaction' }
        attachments:
          type: array
          items:
            type: object
            required: [url, name, mime, size]
            properties:
              url: { type: string }
              name: { type: string }
              mime: { type: string }
              size: { type: integer, format: int64 }
        author_hub: { type: string, description: Origin hub public key (hex) when authored through the alliance forum write-proxy. Omitted for local replies. }

    ForumTag:
      type: object
      properties:
        id: { type: string }
        channel_id: { type: string }
        label: { type: string }
        color: { type: string, nullable: true }
        position: { type: integer, format: int64 }
        created_at: { type: integer, format: int64 }

    AllianceVoiceGrant:
      type: object
      required: [payload, signature]
      properties:
        payload: { $ref: '#/components/schemas/AllianceVoiceGrantPayload' }
        signature:
          type: string
          description: Hex Ed25519 signature by origin_hub_pubkey over the payload JSON

    AllianceVoiceGrantPayload:
      type: object
      required: [alliance_id, owner_hub_pubkey, channel_id, subject_pubkey, origin_hub_pubkey, origin_hub_url, issued_at, expires_at]
      properties:
        alliance_id: { type: string }
        owner_hub_pubkey:
          type: string
          description: "Must be this hub, so a grant cannot be replayed elsewhere"
        channel_id: { type: string }
        subject_pubkey:
          type: string
          description: |
            The visitor's canonical pubkey. Must equal the identity this
            challenge-response just authenticated — the grant vouches for
            membership of the origin hub, never for identity.
        origin_hub_pubkey: { type: string }
        origin_hub_url: { type: string }
        display_name:
          type: string
          description: "Roster display only. Hub-vouched, not proven."
          nullable: true
        issued_at: { type: integer, format: int64 }
        expires_at: { type: integer, format: int64 }

    AppCommandDef:
      type: object
      required: [name, description]
      properties:
        name: { type: string }
        description: { type: string }
        args: { type: string }
        scope: { type: string, enum: [channel, hub] }
        privileged: { type: boolean }
        cooldown_seconds:
          type: integer
          format: int64
          description: "Per-user, per-command cooldown in seconds (default 3, 0 = none)"

    AppSubscription:
      type: object
      required: [event]
      properties:
        event: { type: string }
        channels: { type: array, items: { type: string } }

    AttestationInput:
      type: object
      required: [attester, signature]
      properties:
        attester: { type: string }
        signature: { type: string }

    CreateSlotRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        capacity: { type: integer, format: int64, nullable: true, description: "Omit or null = unlimited" }

    Embed:
      type: object
      properties:
        title: { type: string }
        url: { type: string }
        description: { type: string }
        color: { type: string }
        fields: { type: array, items: { $ref: '#/components/schemas/EmbedField' } }
        thumbnail_url: { type: string }
        image_url: { type: string }
        footer: { $ref: '#/components/schemas/EmbedFooter' }

    EmbedField:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string }
        inline: { type: boolean }

    EmbedFooter:
      type: object
      required: [text]
      properties:
        text: { type: string }

    EncryptedDmEnvelope:
      type: object
      required: [sender_pubkey, conv_id, ciphertext_hex, nonce_hex, dh_pubkey_hex, signature_hex]
      properties:
        sender_pubkey: { type: string }
        conv_id: { type: string }
        ciphertext_hex: { type: string }
        nonce_hex: { type: string }
        dh_pubkey_hex: { type: string }
        signature_hex: { type: string }
        v: { type: integer }
        message_index: { type: integer }
        prev_count: { type: integer }
        signer_cert: { $ref: '#/components/schemas/SubkeyCert' }

    FavoriteHub:
      type: object
      required: [url, name]
      properties:
        url: { type: string }
        name: { type: string }
        icon: { type: string }

    GameLaunchCard:
      type: object
      required: [entry_url, name]
      properties:
        entry_url: { type: string }
        name: { type: string }
        description: { type: string }
        thumbnail_url: { type: string }

    GroupEncryptedEnvelope:
      type: object
      required: [sender_pubkey, conv_id, sender_key_version, iteration, ciphertext_hex, nonce_hex, signature_hex]
      properties:
        sender_pubkey: { type: string }
        conv_id: { type: string }
        sender_key_version: { type: integer }
        iteration: { type: integer }
        ciphertext_hex: { type: string }
        nonce_hex: { type: string }
        signature_hex: { type: string }
        signer_cert: { $ref: '#/components/schemas/SubkeyCert' }

    PollOption:
      type: object
      required: [id, text]
      properties:
        id: { type: string }
        text: { type: string }

    PowProof:
      type: object
      required: [level, nonce]
      properties:
        level: { type: integer }
        nonce: { type: string }

    PublicHubEntry:
      type: object
      required: [hub_url, hub_name, joined_at]
      properties:
        hub_url: { type: string }
        hub_name: { type: string }
        joined_at: { type: integer, format: int64 }

    SenderKeyRecipientBlob:
      type: object
      required: [recipient_pubkey, wrapped_key_hex, wrap_nonce_hex, iteration]
      properties:
        recipient_pubkey: { type: string }
        wrapped_key_hex: { type: string }
        wrap_nonce_hex: { type: string }
        iteration: { type: integer }

    SubkeyCert:
      type: object
      required: [master_pubkey, subkey_pubkey, device_label, issued_at, signature]
      properties:
        master_pubkey: { type: string }
        subkey_pubkey: { type: string }
        device_label: { type: string }
        issued_at: { type: integer, format: int64 }
        not_after: { type: integer, format: int64 }
        fallback_hubs: { type: array, items: { type: string } }
        signature: { type: string }

    SurveyAnswerInput:
      type: object
      required: [question_id]
      properties:
        question_id: { type: string }
        choice_id: { type: string }
        text_answer: { type: string }

    SurveyChoiceAdmin:
      type: object
      required: [id, label, display_order, role_ids]
      properties:
        id: { type: string }
        label: { type: string }
        display_order: { type: integer, format: int64 }
        role_ids: { type: array, items: { type: string } }

    SurveyQuestionAdmin:
      type: object
      required: [id, prompt, kind, required, display_order]
      properties:
        id: { type: string }
        prompt: { type: string }
        kind: { type: string }
        required: { type: boolean }
        display_order: { type: integer, format: int64 }
        choices: { type: array, items: { $ref: '#/components/schemas/SurveyChoiceAdmin' } }

    WebhookSubscriptionDto:
      type: object
      required: [event]
      properties:
        event: { type: string }
        channels: { type: array, items: { type: string } }

paths:

  # ── WebSocket ─────────────────────────────────────────────────────────────

  /ws:
    get:
      operationId: connectWebSocket
      summary: Realtime WebSocket endpoint
      description: |
        Upgrades to a WebSocket carrying all realtime traffic. Authenticate
        with the `token` query parameter (the session token); the
        upgrade is rejected with `401`/`403` on invalid, expired, or banned
        credentials.

        The full message catalogue — every client→server and server→client
        JSON message with exact field names and types — is documented in
        [`docs/ws-protocol.md`](docs/ws-protocol.md) (see also the
        "WebSocket protocol" section of this file's description).
      security: []
      tags: [WebSocket]
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
          description: Session token from `POST /auth/verify`.
      responses:
        "101":
          description: Switching Protocols — WebSocket established.
        "401":
          description: Invalid or expired token.

  # ── Health ────────────────────────────────────────────────────────────────

  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      security: []
      tags: [Health]
      responses:
        "200":
          description: Hub is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /info:
    get:
      operationId: getInfo
      summary: Hub metadata
      description: Returns public hub information. No auth required — used by clients before joining.
      security: []
      tags: [Health]
      responses:
        "200":
          description: Hub info
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HubInfo' }

  # ── Auth ──────────────────────────────────────────────────────────────────

  /auth/challenge:
    post:
      operationId: createAuthChallenge
      summary: Request an auth challenge
      description: |
        Returns a random 32-byte nonce, hex-encoded, valid for 60 seconds.
        The client signs it with its Ed25519 private key (see `scheme`) and
        submits it to `POST /auth/verify`.
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key]
              properties:
                public_key:
                  type: string
                  description: Hex-encoded Ed25519 public key (64 hex chars)
      responses:
        "200":
          description: Challenge issued
          content:
            application/json:
              schema:
                type: object
                required: [challenge]
                properties:
                  challenge: { type: string, description: "32 random bytes, lowercase hex (64 chars)" }
                  scheme:
                    type: string
                    enum: [tagged-v1]
                    description: >-
                      Present when the answer may be signed over
                      "wavvon/auth-challenge/v1\0" || hex-decoded challenge
                      (wire-format.md). Omitted by older hubs, which take a
                      signature over the raw decoded bytes only. A hub that
                      sends it still accepts the raw form.

  /auth/verify:
    post:
      operationId: verifyAuth
      summary: Verify signature and obtain session token
      description: |
        Submit the signed challenge to receive a Bearer token.

        **Signing:** hex-decode `challenge` to its 32 bytes. If
        `POST /auth/challenge` returned `scheme: "tagged-v1"`, sign
        `b"wavvon/auth-challenge/v1\0" || challenge_bytes`; with no `scheme`,
        sign the raw 32 bytes (wire-format.md). Encode the 64-byte signature
        as lowercase hex. Send `challenge` back as the hex string you received.

        **PoW:** if the hub requires a security level > 0, compute:
        `SHA256(utf8(public_key_hex) || little_endian_u64(nonce))` and find a
        `nonce` (u64, starting from 1) whose hash has ≥ N leading zero bits.
        Submit that nonce as `security_nonce` and N as `security_level`.
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key, challenge, signature]
              properties:
                public_key: { type: string }
                challenge: { type: string }
                signature:
                  type: string
                  description: Hex-encoded Ed25519 signature over the challenge bytes
                invite_code: { type: string, description: Required for invite-only hubs }
                security_nonce: { type: integer, format: int64, description: PoW nonce }
                security_level: { type: integer, description: Claimed PoW level }
                pow_proof: { $ref: '#/components/schemas/PowProof' }
                subkey_cert:
                  allOf: [{ $ref: '#/components/schemas/SubkeyCert' }]
                  description: "Multi-device: links a device subkey to a master key"
                challenge_token:
                  type: string
                  description: Token from POST /challenge/verify (required when challenge_mode != off)
                is_hub:
                  type: boolean
                  description: >-
                    Set by a hub authenticating to federate; yields a `peer` session unless the key
                    is already a member
                certifications: { type: array, items: { $ref: '#/components/schemas/Certification' } }
                alliance_voice_grant:
                  allOf: [{ $ref: '#/components/schemas/AllianceVoiceGrant' }]
                  description: |
                    Voice in alliance channels: an origin hub's signed assertion that the
                    caller is its member and the named channel is shared with an alliance
                    this hub belongs to. Minted by
                    `POST /alliances/{alliance_id}/voice-grant` on the caller's own hub.

                    Admits a **visitor** — a session scoped to `alliance_voice`, with no
                    `users` row on this hub, no roles and no message access. Ignored for a
                    caller who is already a member here, who gets their normal session.

                    Requires the `voice.alliance` capability on this hub.
      responses:
        "200":
          description: Auth successful
          content:
            application/json:
              schema:
                type: object
                required: [token, scope, canonical_pubkey]
                properties:
                  token:
                    type: string
                    description: "Session token, 32 random bytes hex. Send as `Authorization: Bearer <token>` and as `/ws?token=`."
                  scope:
                    type: string
                    enum: [member, lobby, alliance_voice, peer]
                    description: |
                      'lobby' means the user must complete PoW in /lobby before full access.
                      'alliance_voice' is a visitor from an allied hub, admitted to one shared
                      voice channel and confined to /info, the DH-key routes and /ws.
                      'peer' is a federating hub (sent `is_hub: true` and is not a member),
                      confined to the federation routes and refused at /ws.
                  canonical_pubkey:
                    type: string
                    description: |
                      The identity this session acts as. Equals `public_key` for a
                      single-key sign-in; for a device authenticating with a
                      `subkey_cert` it is the master (or the pre-existing legacy key)
                      the hub attributes that device's actions to. Use it to recognise
                      yourself in rosters and message authors.
        "401":
          description: Invalid signature or banned

  # ── Me ────────────────────────────────────────────────────────────────────

  /me:
    get:
      operationId: getMe
      summary: Get own profile and roles
      tags: [Me]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeInfo' }
    patch:
      operationId: updateMe
      summary: Update display name and avatar
      tags: [Me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string }
                avatar: { type: string, nullable: true }
                bio: { type: string }
                pronouns: { type: string }
                status_message: { type: string }
                activities: { type: string }
                accent_color: { type: string }
                cover: { type: string }
                favorite_hubs: { type: array, items: { $ref: '#/components/schemas/FavoriteHub' } }
                show_hubs: { type: boolean }
                findable_by_allies:
                  type: boolean
                  description: >-
                    List me to members of allied hubs (see `GET /alliances/{alliance_id}/people`).
                    Per hub, off by default; only takes effect while the alliance's own
                    `people_visible` switch is on. Hubs advertising `alliance.people`.
                birthday: { type: string }
                name_color: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeInfo' }
    delete:
      operationId: deleteMe
      summary: Leave this hub
      description: |
        Removes the caller from the hub: profile fields cleared, every role
        deleted, sessions ended. The `users` row itself is **kept** as a bare
        pubkey — moderation records and message authorship reference it, so a
        departure must not take a ban or a report with it. Messages,
        reactions and RSVPs are untouched; the author becomes a pubkey with
        no name.

        Self only. Removing someone else is `/moderation`.

        Note that membership *is* the roles, and the invite gate is "has no
        roles", so on an `invite_only` hub this makes the return that is
        otherwise free require a fresh invite. Clients say so before asking.

        Advertised as the `hub.leave` capability; a hub without it answers 404
        and the client must not offer the action.
      tags: [Me]
      responses:
        "204":
          description: Left the hub
        "409":
          description: The caller is the owner — transfer ownership first

  # ── Passkey / device credential management ──────────────────────────────────

  /me/credentials:
    get:
      operationId: listMeCredentials
      summary: List the caller's registered passkeys
      tags: [Me]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    friendly_name: { type: string, nullable: true }
                    aaguid: { type: string, nullable: true }
                    created_at: { type: integer, format: int64 }
                    last_used_at: { type: integer, format: int64, nullable: true }

  /me/credentials/{id}:
    patch:
      operationId: updateMeCredential
      summary: Rename a passkey
      tags: [Me]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [friendly_name]
              properties:
                friendly_name: { type: string }
      responses:
        "200":
          description: OK
    delete:
      operationId: deleteMeCredential
      summary: Remove a passkey
      tags: [Me]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: No content

  # ── Hub ───────────────────────────────────────────────────────────────────

  /hub:
    patch:
      operationId: updateHub
      summary: Update hub name / icon (admin)
      tags: [Hub]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                icon: { type: string }
                require_approval: { type: boolean }
                min_security_level: { type: integer }
                max_channel_depth: { type: integer }
                welcome_label: { type: string }
                welcome_invite_url: { type: string }
                farewell_label: { type: string }
                default_invite_role_id: { type: string }
                timezone: { type: string }
                birthdays_enabled: { type: boolean }
                afk_channel_id: { type: string }
                afk_timeout_secs: { type: integer }
                max_attachment_bytes: { type: integer, format: int64 }
                max_upload_bytes: { type: integer, format: int64 }
                name_color_mode: { type: string }
      responses:
        "200":
          description: OK

  /hub/settings:
    get:
      operationId: getHubSettings
      summary: Get hub settings (admin)
      tags: [Hub]
      responses:
        "200":
          description: Hub settings object

  /hub/members:
    get:
      operationId: listHubMembers
      summary: List all hub members
      tags: [Hub]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MemberAdminInfo' }

  /hub/pending:
    get:
      operationId: listHubPending
      summary: List users awaiting approval (admin)
      description: |
        Oldest first — the queue is worked from the front, so the cursor moves
        forward through the list rather than back like the newest-first ones.
        Paged only on hubs advertising `list.cursor.lists`.
      tags: [Hub]
      parameters:
        - name: limit
          in: query
          description: Page size, clamped to 1..500.
          schema: { type: integer, format: int64, default: 100, minimum: 1, maximum: 500 }
        - name: cursor
          in: query
          description: Keyset cursor — the `public_key` of the previous page's last row.
          schema: { type: string }
      responses:
        "200":
          description: OK

  /hub/pending/{target_key}/approve:
    post:
      operationId: approveHubPending
      summary: Approve a pending user (admin)
      tags: [Hub]
      parameters:
        - name: target_key
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK

  /hub/icons:
    get:
      operationId: listHubIcons
      summary: List custom hub icons
      tags: [Hub]
      responses:
        "200":
          description: OK
    post:
      operationId: createHubIcon
      summary: Upload a custom SVG icon (admin)
      tags: [Hub]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, svg_content]
              properties:
                name: { type: string }
                svg_content: { type: string }
      responses:
        "201":
          description: Created

  /hub/icons/{icon_id}:
    patch:
      operationId: updateHubIcon
      summary: Rename a hub icon (admin)
      tags: [Hub]
      parameters:
        - name: icon_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: OK
    delete:
      operationId: deleteHubIcon
      summary: Delete a hub icon (admin)
      tags: [Hub]
      parameters:
        - name: icon_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: No content

  /hub/settings/lobby:
    put:
      operationId: setHubSettingsLobby
      summary: Update lobby / security level settings (admin)
      tags: [Hub]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lobby_enabled]
              properties:
                lobby_enabled: { type: boolean }
                welcome_md: { type: string, nullable: true }
      responses:
        "200":
          description: OK

  /hub/settings/challenge:
    put:
      operationId: setHubSettingsChallenge
      summary: Update bot-challenge mode (admin)
      tags: [Hub]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_mode, challenge_difficulty]
              properties:
                challenge_mode: { type: string, enum: ["off", click, puzzle, both] }
                challenge_difficulty: { type: string }
      responses:
        "200":
          description: OK

  # ── Channels ──────────────────────────────────────────────────────────────

  /apps:
    get:
      operationId: listApps
      summary: List the apps registered on this hub (any member)
      description: >
        What a client needs for slash-command autocomplete. Registering an app
        is gated on `apps.register`; reading what apps say about themselves is
        not. See apps.md.
      tags: [Apps]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    pubkey: { type: string }
                    name: { type: string }
                    avatar_url: { type: string }
                    description: { type: string }
                    game:
                      type: object
                      properties:
                        entry_url: { type: string }
                        name: { type: string }
                        description: { type: string }
                        thumbnail_url: { type: string }
                    commands:
                      type: array
                      items:
                        type: object
                        properties:
                          name: { type: string }
                          description: { type: string }

  /me/app:
    get:
      operationId: getMeApp
      summary: The caller's own app registration (apps.register)
      tags: [Apps]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppRegistration" }
        "404": { description: No app registered for this identity }

  /me/app/profile:
    put:
      operationId: setMeAppProfile
      summary: Register or replace the caller's app profile (apps.register)
      tags: [Apps]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                avatar_url: { type: string }
                webhook_url: { type: string, description: "https only; receives slash invocations" }
                description: { type: string }
                homepage_url: { type: string }
                commands: { type: array, items: { $ref: '#/components/schemas/AppCommandDef' } }
                capabilities: { type: array, items: { type: string } }
                mini_app_url: { type: string }
                requires_camera: { type: boolean }
                game: { $ref: '#/components/schemas/GameLaunchCard' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppRegistration" }
        "403": { description: Caller lacks apps.register }

  /me/app/commands:
    put:
      operationId: setMeAppCommands
      summary: Replace the caller's slash command list (apps.register)
      tags: [Apps]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commands]
              properties:
                commands: { type: array, items: { $ref: '#/components/schemas/AppCommandDef' } }
      responses:
        "200": { description: Replaced }
        "403": { description: Caller lacks apps.register }

  /me/app/subscriptions:
    put:
      operationId: setMeAppSubscriptions
      summary: Replace the caller's hub-event subscriptions (apps.register)
      description: >
        A `message.*` subscription must name its channels; a hub-wide one
        would be every conversation at once. Delivery is filtered by the
        subscriber's own read access to the channel the event happened in.
      tags: [Apps]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscriptions]
              properties:
                subscriptions: { type: array, items: { $ref: '#/components/schemas/AppSubscription' } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, format: int64 }
        "400": { description: A message.* subscription named no channels }
        "403": { description: Caller lacks apps.register }


  /channels:
    get:
      operationId: listChannels
      summary: List all channels and categories
      tags: [Channels]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Channel' }
    post:
      operationId: createChannel
      summary: Create a channel or category (manage_channels)
      tags: [Channels]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                parent_id: { type: string, nullable: true }
                is_category: { type: boolean }
                description: { type: string }
                channel_type: { type: string }
                banner_url: { type: string }
                banner_file_id: { type: string }
                spawner_name_template: { type: string }
                nsfw: { type: boolean }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }

  /channels/reorder:
    post:
      operationId: reorderChannels
      summary: Reorder channels (manage_channels)
      tags: [Channels]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_ids]
              properties:
                channel_ids: { type: array, items: { type: string } }
      responses:
        "200":
          description: OK

  /channels/{channel_id}:
    patch:
      operationId: updateChannel
      summary: Update channel (manage_channels)
      tags: [Channels]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                parent_id: { type: string, nullable: true }
                icon: { type: string, nullable: true }
                color: { type: string, nullable: true }
                custom_icon_svg: { type: string, nullable: true }
                min_talk_power: { type: integer, format: int64 }
                retention_days: { type: integer, format: int64, nullable: true }
                banner_url: { type: string }
                banner_file_id: { type: string }
                forum_require_tag: { type: boolean }
                nsfw: { type: boolean }
                channel_type:
                  type: string
                  enum: [text, voice]
                  description: Switch between text and voice; both keep their chat.
      responses:
        "200":
          description: OK
    delete:
      operationId: deleteChannel
      summary: Delete channel (manage_channels)
      tags: [Channels]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: No content

  # ── Channel permission overwrites (nested-channels §3.6) ──────────────────

  /channels/{channel_id}/my-permissions:
    get:
      operationId: getChannelMyPermissions
      summary: Caller's resolved effective permissions on a channel
      description: >-
        Not gated on manage_roles — any member may see their own effective
        channel-scoped permission set (hub-wide baseline + ancestor-chain
        overwrite cascade). `is_admin` short-circuits every check.
      tags: [Channels]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel_id: { type: string }
                  permissions: { type: array, items: { type: string } }
                  is_admin: { type: boolean }

  /channels/{channel_id}/permissions:
    get:
      operationId: listChannelPermissions
      summary: Get resolved permission overwrites for every role on a channel (manage_roles)
      tags: [Channels]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel_id: { type: string }
                  roles:
                    type: array
                    items:
                      type: object
                      properties:
                        role_id: { type: string }
                        role_name: { type: string }
                        overwrites:
                          type: object
                          properties:
                            allow: { type: array, items: { type: string } }
                            deny: { type: array, items: { type: string } }
                        inherited: { type: array, items: { type: string } }
                        effective: { type: array, items: { type: string } }

  /channels/{channel_id}/permissions/{role_id}:
    put:
      operationId: setChannelPermission
      summary: Replace a role's permission overwrites on a channel (manage_roles)
      description: >-
        Cannot grant `admin` via an overwrite, cannot edit a role at or
        above the caller's own priority, and can only allow permissions
        the caller effectively holds on the channel.
      tags: [Channels]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: role_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allow: { type: array, items: { type: string } }
                deny: { type: array, items: { type: string } }
      responses:
        "200":
          description: OK
        "403":
          description: Role at or above caller's priority, or grant exceeds caller's own permissions
    delete:
      operationId: deleteChannelPermission
      summary: Clear a role's permission overwrites on a channel (manage_roles)
      tags: [Channels]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: role_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: No content

  # /channels/{channel_id}/members was removed 2026-08-08: it ignored its
  # channel_id and returned the same rows as GET /users. Use /users.

  /voice/populations:
    get:
      operationId: listVoicePopulations
      summary: Voice user count per channel
      tags: [Voice]
      responses:
        "200":
          description: OK

  /voice/active-users:
    get:
      operationId: listVoiceActiveUsers
      summary: List all users in any voice channel
      tags: [Voice]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { type: string } }

  /voice/participants:
    get:
      operationId: listVoiceParticipants
      summary: Participants in the caller's current voice channel
      tags: [Voice]
      responses:
        "200":
          description: OK

  # ── Messages ──────────────────────────────────────────────────────────────

  /channels/{channel_id}/messages:
    get:
      operationId: listChannelMessages
      summary: Fetch message history
      tags: [Messages]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
          description: >-
            The `id` of the last message of the previous page. Newest first;
            with `thread_root`, oldest first and the cursor pages forward.
        - name: limit
          in: query
          schema: { type: integer, format: int64, default: 50, maximum: 100 }
        - name: thread_root
          in: query
          schema: { type: string }
          description: Return only replies to this message, oldest first.
        - name: q
          in: query
          schema: { type: string }
          description: Full-text search within the channel; one page of hits, `cursor` ignored.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Message' }
    post:
      operationId: createChannelMessage
      summary: Send a message
      tags: [Messages]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
                reply_to: { type: string, description: Message ID being replied to }
                game: { $ref: '#/components/schemas/GameLaunchCard' }
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        "200":
          description: A slash command failed; the body is the ephemeral error reply, visible to the caller only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }

  /channels/{channel_id}/messages/{message_id}:
    patch:
      operationId: updateChannelMessage
      summary: Edit own message
      tags: [Messages]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: message_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                embeds: { type: array, items: { $ref: '#/components/schemas/Embed' } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
    delete:
      operationId: deleteChannelMessage
      summary: Delete message (own or manage_messages)
      tags: [Messages]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: message_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: No content

  /channels/{channel_id}/messages/{message_id}/reactions:
    post:
      operationId: createChannelMessageReaction
      summary: Add reaction to a message
      tags: [Messages]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: message_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji: { type: string }
      responses:
        "201":
          description: Created

  /channels/{channel_id}/messages/{message_id}/reactions/{emoji}:
    delete:
      operationId: deleteChannelMessageReaction
      summary: Remove own reaction
      tags: [Messages]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: message_id
          in: path
          required: true
          schema: { type: string }
        - name: emoji
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: No content

  # ── Direct Messages ───────────────────────────────────────────────────────

  /conversations:
    get:
      operationId: listConversations
      summary: List DM conversations
      description: Newest first. Paged only on hubs advertising `list.cursor.lists`.
      tags: [DMs]
      parameters:
        - name: limit
          in: query
          description: Page size, clamped to 1..500.
          schema: { type: integer, format: int64, default: 100, minimum: 1, maximum: 500 }
        - name: cursor
          in: query
          description: Keyset cursor — the `id` of the previous page's last row.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Conversation' }
    post:
      operationId: createConversation
      summary: Create a DM conversation
      tags: [DMs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [members]
              properties:
                members: { type: array, items: { type: string } }
                member_hubs: { type: object, additionalProperties: { type: string } }
                member_masters: { type: object, additionalProperties: { type: string } }
      responses:
        "201":
          description: Conversation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        "200":
          description: A 1-on-1 conversation with this member already exists; it is returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }

  /conversations/{conversation_id}/messages:
    get:
      operationId: listConversationMessages
      summary: List messages in a DM conversation (paginated)
      description: >
        Newest `limit` messages, returned oldest-first. Page backwards with
        `before` = the `id` of the oldest row you already have. Before
        2026-08-08 this took no query params and returned the entire history
        on every call, though both clients were already sending these two.
      tags: [DMs]
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          description: Page size, clamped to 1..100.
          schema: { type: integer, format: int64, default: 50, minimum: 1, maximum: 100 }
        - name: cursor
          in: query
          description: Keyset cursor — the `id` of the oldest message already held.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DmMessage' }
    post:
      operationId: createConversationMessage
      summary: Send a DM
      tags: [DMs]
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string }
                attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
                encrypted_envelope: { $ref: '#/components/schemas/EncryptedDmEnvelope' }
                group_encrypted_envelope: { $ref: '#/components/schemas/GroupEncryptedEnvelope' }
                plaintext_signature:
                  type: string
                  description: >-
                    Hex Ed25519 signature over the federated plaintext DM bytes (wire-format.md). A
                    recipient on another hub refuses an unsigned plaintext DM.
                plaintext_signer_cert:
                  allOf: [{ $ref: '#/components/schemas/SubkeyCert' }]
                  description: >-
                    When the signing key is not the sender's canonical key: the master-signed cert
                    tying the two. Only on a hub advertising `dms.plaintext.signercert`.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DmMessage' }

  /conversations/{conversation_id}:
    get:
      operationId: getConversation
      summary: One conversation the caller is a member of
      description: >-
        Membership is enforced by the query, so a non-member gets the same 404
        as a nonexistent id — an id alone never confirms a conversation exists.
      tags: [DMs]
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        "404": { description: "No such conversation, or the caller is not a member" }

  # ── Friends ───────────────────────────────────────────────────────────────

  /friends:
    get:
      operationId: listFriends
      summary: List accepted friends
      tags: [Friends]
      responses:
        "200":
          description: OK
    post:
      operationId: createFriend
      summary: Send a friend request
      tags: [Friends]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_public_key]
              properties:
                target_public_key: { type: string }
                hub_url: { type: string, description: Required for federated (cross-hub) friends }
                display_name: { type: string }
      responses:
        "201":
          description: Created

  /friends/pending:
    get:
      operationId: listPendingFriends
      summary: List incoming pending friend requests
      tags: [Friends]
      responses:
        "200":
          description: OK

  /friends/{public_key}/accept:
    post:
      operationId: acceptFriend
      summary: Accept a friend request
      tags: [Friends]
      parameters:
        - name: public_key
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK

  /friends/{public_key}:
    delete:
      operationId: deleteFriend
      summary: Remove a friend
      tags: [Friends]
      parameters:
        - name: public_key
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: No content

  # ── Invites ───────────────────────────────────────────────────────────────

  /invites:
    get:
      operationId: listInvites
      summary: List active invites (manage_invites)
      description: >-
        Newest first, and only the invites that can still admit someone — an
        expired or used-up one is returned only with `include_inactive=true`,
        on hubs advertising `invites.status`. Paged only on hubs advertising
        `list.cursor.lists`.
      tags: [Invites]
      parameters:
        - name: include_inactive
          in: query
          description: Include invites that are expired or have no uses left.
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          description: Page size, clamped to 1..500.
          schema: { type: integer, format: int64, default: 100, minimum: 1, maximum: 500 }
        - name: cursor
          in: query
          description: Keyset cursor — the `code` of the previous page's last row.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Invite' }
    post:
      operationId: createInvite
      summary: Create an invite (manage_invites)
      description: >-
        With `bound_pubkey` set the invite admits that identity and nobody
        else, and `max_uses` is forced to 1 — a code that names its recipient
        and admits several people is a contradiction. On hubs advertising
        `invites.bound`; an older hub ignores the field and mints an
        ordinary bearer code, which is why a client must test for the string
        before offering it.


        Redeeming a bound invite also **satisfies the admission challenge**:
        an admin naming one key is the human act the challenge asks about, so
        a client with nobody watching its screen can join a hub that has
        `challenge_mode` on. A bearer invite buys no such exemption.
      tags: [Invites]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                max_uses: { type: integer, format: int64, nullable: true }
                expires_in_seconds:
                  type: integer
                  format: int64
                  description: >-
                    Lifetime in seconds from now. Omitted means no expiry, except as noted under
                    `grant_role_id`.
                  nullable: true
                grant_role_id:
                  type: string
                  description: >-
                    Role granted to the joining member besides the everyone role. Must exist, and
                    the creator must be able to grant every permission it carries. A role that
                    amounts to a takeover caps the invite to one use and a short expiry.
                  nullable: true
                bound_pubkey:
                  type: string
                  description: "64 hex characters. The only identity this invite admits."
                  nullable: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invite' }

  /invites/{code}:
    delete:
      operationId: deleteInvite
      summary: Revoke an invite (manage_invites)
      tags: [Invites]
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: No content

  # ── Roles ─────────────────────────────────────────────────────────────────

  /permissions:
    get:
      operationId: listPermissions
      summary: The permission catalogue this hub can express
      description: >-
        Every permission id with its scope, so clients render the roles and
        channel-overwrite screens from the server that enforces them rather
        than from their own copy. Readable by any member: it is what the hub
        can express, not what the caller holds.


        Gated by the `permissions.catalogue` capability — a hub without it
        uses the older snake_case ids, which share no spelling with these.
      tags: [Roles]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, example: moderation.ban.permanent }
                        scope:
                          type: string
                          enum: [hub, hub_and_channel]
                          description: >-
                            `hub_and_channel` may also be set as a channel
                            overwrite. Offering a `hub` entry there is a 400.
                        group:
                          type: string
                          description: Dotted prefix, for grouping without re-splitting the id.
                          example: moderation

  /users/{public_key}/permissions/why:
    get:
      operationId: explainUserPermissions
      summary: Why this member can (or cannot) do X here
      description: >-
        Answers *role Moderators, allowed on #general*. Two axes are debuggable
        by reading and not by guessing, and every operator question about
        permissions is this one. Reading your own answer is always allowed;
        reading someone else's needs `members.read`.


        `sources` is every row bearing on the answer, in the order the resolver
        folds them: the hub-wide baseline first, then the channel's ancestor
        chain root to target. An owner's answer carries `is_owner` and no
        sources, because no role explains it.
      tags: [Roles]
      parameters:
        - name: public_key
          in: path
          required: true
          schema: { type: string }
        - name: permission
          in: query
          required: true
          schema: { type: string }
        - name: channel_id
          in: query
          required: false
          schema: { type: string }
          description: Omit for the hub-wide answer.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  public_key: { type: string }
                  permission: { type: string }
                  channel_id: { type: string, nullable: true }
                  allowed: { type: boolean }
                  is_owner: { type: boolean }
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        role_id: { type: string }
                        role_name: { type: string }
                        kind:
                          type: string
                          enum: [baseline, allow, deny]
                        channel_id: { type: string, nullable: true }
        "400":
          description: The permission id is not in this hub's catalogue.

  /roles:
    get:
