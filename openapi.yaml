          in: path
          required: true
          schema: { type: string }

  /users/{public_key}/roles:
    get:
      operationId: listUserRoles
      summary: Get roles assigned to a user
      tags: [Roles]
      parameters:
        - name: public_key
          in: path
          required: true
          schema: { type: string }

  /users/{public_key}/roles/{role_id}:
    put:
      operationId: setUserRole
      summary: Assign role to user (manage_roles)
      tags: [Roles]
      parameters:
        - name: public_key
          in: path
          required: true
          schema: { type: string }
        - name: role_id
          in: path
          required: true
