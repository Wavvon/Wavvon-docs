  /admin/badges/issue:
    post:
      operationId: issueAdminBadge
      summary: Issue a badge to another hub (admin)
      description: >-
        Fetches the recipient hub's /info, signs the badge payload with this
        hub's keypair, delivers it to the recipient's
        /federation/badge-offer, and records it locally.
      tags: [Badges]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient_hub_url, label]
              properties:
                recipient_hub_url: { type: string }
                label: { type: string }
                note: { type: string }
                expires_days: { type: integer }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  recipient_hub_url: { type: string }
                  recipient_hub_pubkey: { type: string }
                  label: { type: string }
                  payload: { $ref: '#/components/schemas/BadgePayload' }
                  issued_at: { type: string }
                  expires_at: { type: string, nullable: true }
        "502":
          description: Recipient hub unreachable

  /admin/badges/issued:
    get:
      operationId: listAdminIssuedBadges
      summary: List badges this hub has issued (admin)
      tags: [Badges]
      responses:
        "200":
          description: OK

  /admin/badges/issued/{id}/revoke:
    delete:
      operationId: revokeAdminIssuedBadge
      summary: Revoke an issued badge (admin)
      description: Sets `revoked_at`; the revocation appears in /federation/badge-revocations.
      tags: [Badges]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: No content

  /federation/badge-offer:
    post:
      operationId: createFederationBadgeOffer
      summary: Receive a badge offer from another hub
      description: Hub-to-hub. The Ed25519 signature over the payload is the credential; no Bearer token.
      security: []
      tags: [Badges]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_hub_pubkey, from_hub_url, label, payload, signature]
              properties:
                from_hub_pubkey: { type: string }
                from_hub_url: { type: string }
                label: { type: string }
                note: { type: string, nullable: true }
                payload: { type: string, description: Canonical BadgePayload JSON string }
                signature: { type: string, description: Hex Ed25519 signature over payload bytes }
      responses:
        "201":
          description: Offer stored
        "202":
          description: Duplicate offer; already stored

  /federation/badge-revocations:
    get:
      operationId: listFederationBadgeRevocations
      summary: List badges this hub has revoked (public, polled by other hubs)
      security: []
      tags: [Badges]
      parameters:
        - name: since
          in: query
          schema: { type: string }
          description: ISO-8601 timestamp — only revocations at or after this time
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    recipient_hub_pubkey: { type: string }
                    label: { type: string }
                    revoked_at: { type: string }

  # ── Certifications ────────────────────────────────────────────────────────

  /admin/certs:
    get:
      operationId: listAdminCerts
      summary: List all cert issuances (admin)
      tags: [Certifications]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    subject_pubkey: { type: string }
                    pow_level: { type: integer, format: int64, nullable: true }
                    member_since: { type: integer, format: int64 }
                    issued_at: { type: integer, format: int64 }
                    expires_at: { type: integer, format: int64 }
                    revoked_at: { type: integer, format: int64, nullable: true }
                    standing: { type: string, enum: [good, revoked] }
                    payload: { $ref: '#/components/schemas/CertPayload' }

  /admin/certs/{pubkey}:
    post:
      operationId: issueAdminCert
      summary: Manually issue a cert for a user (admin)
      tags: [Certifications]
      parameters:
        - name: pubkey
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certification' }
        "403":
          description: User not approved or banned

  /admin/certs/{pubkey}/badge:
    post:
      operationId: createAdminCertBadge
      summary: Grant a named achievement badge to a user (admin)
      description: >-
        A badge is a certification carrying a label (+ optional
        description/icon); it lands in the user's portfolio and links back
        to this hub via issuer_url.
      tags: [Certifications]
      parameters:
        - name: pubkey
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, description: "1–64 chars" }
                description: { type: string }
                icon: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certification' }
        "403":
          description: User not approved or banned

  /admin/certs/{pubkey}/revoke:
    post:
      operationId: revokeAdminCert
      summary: Revoke a user's certs (admin)
      description: Marks existing certs revoked and re-issues a short-lived standing=revoked cert so pull-path verifiers see it.
      tags: [Certifications]
      parameters:
        - name: pubkey
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: No content

  /admin/settings/certs:
    get:
      operationId: listAdminSettingsCerts
      summary: Get certification settings (admin)
      tags: [Certifications]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cert_mode: { type: string, enum: [none, any, trusted] }
                  cert_auto_issue: { type: boolean }
                  cert_min_age_days: { type: integer, format: int64 }
                  cert_validity_days: { type: integer, format: int64 }
                  cert_trusted_issuers: { type: array, items: { type: string } }
                  cert_issuer_urls:
                    type: object
                    additionalProperties: { type: string }
                    description: >-
                      Issuer pubkey to base URL, for the issuers this hub can
                      pull a portfolio from during admission. Sparse: trust does
                      not require an address, and an issuer without one still
                      has its pushed certs honoured.
    patch:
      operationId: updateAdminSettingsCerts
      summary: Update certification settings (admin)
      description: >-
        All fields optional. Scalars are accepted as strings, booleans or
        numbers and stored as text. `cert_min_age_days` is the standing period,
        under the name GET returns.
      tags: [Certifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cert_auto_issue:
                  oneOf: [{ type: string }, { type: boolean }]
                cert_min_age_days:
                  oneOf: [{ type: string }, { type: integer }]
                cert_validity_days:
                  oneOf: [{ type: string }, { type: integer }]
                cert_mode: { type: string, enum: [none, any, trusted] }
                cert_trusted_issuers: { type: array, items: { type: string } }
                cert_issuer_urls:
                  type: object
                  additionalProperties: { type: string }
                  description: "Replaces the whole map, like the trust list it accompanies."
                cert_require:
                  type: object
                  properties:
                    min_pow_level: { type: integer }
                    min_member_since_days: { type: integer }
                cert_min_pow_level:
                  oneOf: [{ type: string }, { type: integer }]
      responses:
        "204":
          description: No content

  /identity/{pubkey}/certs:
    get:
      operationId: listIdentityCerts
      summary: List valid certs for a user (public)
      description: >-
        Returns non-revoked, non-expired certs this hub issued for the user
        plus cross-hub certs deposited into the user's portfolio. Used by
        receiving hubs to pull certs directly from the issuer.
      security: []
      tags: [Certifications]
      parameters:
        - name: pubkey
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Certification' }

  /certs/revocations:
    get:
      operationId: listCertsRevocations
      summary: List cert revocations (public, polled by other hubs)
      security: []
      tags: [Certifications]
      parameters:
        - name: since
          in: query
          schema: { type: integer, format: int64 }
          description: Unix timestamp — only revocations at or after this time
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    subject_pubkey: { type: string }
                    revoked_at: { type: integer, format: int64 }

  # ── Recovery contacts / key rotation ──────────────────────────────────────

  /recovery/contacts:
    get:
      operationId: listRecoveryContacts
      summary: Get the caller's recovery contacts and threshold
      tags: [Recovery]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  owner_pubkey: { type: string }
                  contacts:
                    type: array
                    items:
                      type: object
                      properties:
                        pubkey: { type: string }
                        added_at: { type: integer, format: int64 }
                  threshold: { type: integer, format: int64 }
    put:
      operationId: setRecoveryContacts
      summary: Replace the caller's recovery contact list
      description: Max 5 contacts; threshold must be between 1 and the contact count; the caller cannot be their own contact.
      tags: [Recovery]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contacts, threshold]
              properties:
                contacts: { type: array, items: { type: string } }
                threshold: { type: integer }
      responses:
        "200":
          description: OK

  /recovery/contacts/{pubkey}:
    delete:
      operationId: deleteRecoveryContact
      summary: Remove one recovery contact
      tags: [Recovery]
      parameters:
        - name: pubkey
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK

  /recovery/rotate-key:
    post:
      operationId: rotateRecoveryKey
      summary: Open a key-rotation request with inline attestations
      description: >-
        Called by the NEW key — no Bearer token required. Attestations from
        configured recovery contacts are validated; once the count reaches the
        owner's threshold the request flips to `ready_for_review` for admin
        action.
      security: []
      tags: [Recovery]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_pubkey, new_pubkey, new_key_signature]
              properties:
                old_pubkey: { type: string }
                new_pubkey: { type: string }
                reason: { type: string }
                new_key_signature: { type: string }
                attestations: { type: array, items: { $ref: '#/components/schemas/AttestationInput' } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  old_pubkey: { type: string }
                  new_pubkey: { type: string }
                  status: { type: string, enum: [pending, ready_for_review] }
                  created_at: { type: integer, format: int64 }
                  attestation_count: { type: integer, format: int64 }

  /recovery/requests:
    get:
      operationId: listRecoveryRequests
      summary: List the caller's own rotation requests
      tags: [Recovery]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    new_pubkey: { type: string }
                    status: { type: string }
                    created_at: { type: integer, format: int64 }
                    attestation_count: { type: integer, format: int64 }
                    threshold: { type: integer, format: int64 }

  /recovery/requests/to-attest:
    get:
      operationId: listRecoveryRequestsToAttest
      summary: Open rotation requests that name the caller as a recovery contact
      description: >-
        Pending requests whose old key designated the caller, directly or by
        master key, as a recovery contact, and which the caller has not attested
        yet. Advertised by the `recovery.attest.requests` capability; a
        `recovery_attestation_requested` WebSocket event (`request_id`) tells a
        connected contact when one opens.
      tags: [Recovery]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    old_pubkey: { type: string }
                    new_pubkey: { type: string }
                    reason: { type: string, nullable: true }
                    created_at: { type: integer, format: int64 }
                    attestation_count: { type: integer, format: int64 }
                    threshold: { type: integer, format: int64 }

  /admin/recovery/pending:
    get:
      operationId: listAdminRecoveryPending
      summary: List rotation requests awaiting admin review (admin)
      tags: [Recovery]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    old_pubkey: { type: string }
                    new_pubkey: { type: string }
                    reason: { type: string, nullable: true }
                    status: { type: string }
                    created_at: { type: integer, format: int64 }
                    attestation_count: { type: integer, format: int64 }

  /admin/recovery/{id}/approve:
    post:
      operationId: approveAdminRecovery
      summary: Approve a rotation request (admin)
      description: Transfers roles to the new key and revokes all sessions for the old key; the user re-authenticates with the new key.
      tags: [Recovery]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK

  /admin/recovery/{id}/deny:
    post:
      operationId: denyAdminRecovery
      summary: Deny a rotation request (admin)
      tags: [Recovery]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK

  /recovery/rotation-request/{id}:
    get:
      operationId: getRecoveryRotationRequest
      summary: The bundle a recovery contact signs, plus progress
      description: >-
        No session required: a contact learns the request id out of band and may
        not hold an account on this hub at all. See recovery-attestation.md §2.
      security: []
      tags: [Recovery]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  hub_pubkey: { type: string }
                  old_pubkey: { type: string }
                  new_pubkey: { type: string }
                  nonce: { type: string }
                  status: { type: string, enum: [pending, ready_for_review, approved, rejected] }
                  attestation_count: { type: integer, format: int64 }
                  threshold: { type: integer, format: int64 }

  /recovery/rotation-request/{id}/attest:
    post:
      operationId: attestRecoveryRotationRequest
      summary: A recovery contact vouches for an open rotation request
      description: >-
        The signature is over the canonical `wavvon/recovery-attestation/v1`
        bundle bytes. Signed with the **roster** identity key the hub knows the
        contact by, never a derived multi-device master key. Deduped per
        contact; reaching the owner's threshold flips the request from
        `pending` to `ready_for_review` for admin action.
      security: []
      tags: [Recovery]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attester, signature]
              properties:
                attester: { type: string, description: "Contact's public key, hex" }
                signature: { type: string, description: "Ed25519 signature over the bundle, hex" }
      responses:
        "200": { description: Attestation recorded }
        "400": { description: "Bad signature, or the attester is the old or new key" }
        "403": { description: Attester is not a designated contact for this owner }
        "409": { description: Request is no longer accepting attestations }

  # ── Incoming webhooks ─────────────────────────────────────────────────────

  /admin/webhooks:
    get:
      operationId: listAdminWebhooks
      summary: List incoming webhooks (webhooks.incoming.manage)
      tags: [Webhooks]
      responses:
        "200":
          description: Every active incoming webhook
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, display_name, channel_id, channel_name, webhook_url, created_by, created_at]
                  properties:
                    id: { type: string }
                    display_name: { type: string }
                    channel_id: { type: string }
                    channel_name: { type: string, nullable: true }
                    webhook_url:
                      type: string
                      description: Base URL only; the token is stored hashed and cannot be recovered. Regenerate to get a working URL.
                    created_by: { type: string }
                    created_at: { type: integer, format: int64 }
    post:
      operationId: createAdminWebhook
      summary: Create an incoming webhook for a channel (admin)
      description: The returned `webhook_url` embeds the secret token and is shown **once** — only its hash is stored.
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_id, display_name]
              properties:
                channel_id: { type: string }
                display_name: { type: string }
                avatar_url: { type: string }
                rate_limit: { type: integer, format: int64, default: 5 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  webhook_url: { type: string, description: "Full URL including the secret token" }
                  display_name: { type: string }

  /admin/webhooks/{id}:
    delete:
      operationId: deleteAdminWebhook
      summary: Deactivate a webhook (admin)
      tags: [Webhooks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: No content
    patch:
      operationId: regenerateAdminWebhook
      summary: Issue a fresh token for a webhook (webhooks.incoming.manage)
      description: The old URL stops working. The returned `webhook_url` embeds the new secret token and is shown **once**.
      tags: [Webhooks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The webhook with its new URL
          content:
            application/json:
              schema:
                type: object
                required: [id, webhook_url, display_name]
                properties:
                  id: { type: string }
                  webhook_url: { type: string }
                  display_name: { type: string }
        "404":
          description: Webhook not found

  /webhooks/{id}/{token}:
    post:
      operationId: executeWebhook
      summary: Post a message via an incoming webhook
      description: No Authorization header — the token in the URL is the credential (compared in constant time against the stored hash).
      security: []
      tags: [Webhooks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                username: { type: string, description: "Overrides the webhook's display name" }
                avatar_url: { type: string }
                embeds: { type: object }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, description: "Created message ID" }
        "401":
          description: Invalid webhook token

  # ── Outgoing webhooks (hub -> external URL push) ──────────────────────────

  /admin/outgoing-webhooks:
    get:
      operationId: listAdminOutgoingWebhooks
      summary: List outgoing webhooks (admin)
      tags: [OutgoingWebhooks]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    url: { type: string }
                    display_name: { type: string, nullable: true }
                    active: { type: boolean }
                    failure_count: { type: integer, format: int64 }
                    last_delivery_at: { type: integer, format: int64, nullable: true }
                    last_failure_at: { type: integer, format: int64, nullable: true }
                    created_at: { type: integer, format: int64 }
                    created_by_pubkey: { type: string }
                    subscription_count: { type: integer, format: int64 }
    post:
      operationId: createAdminOutgoingWebhook
      summary: Create an outgoing webhook (admin)
      description: >-
        `url` must be https and must not resolve to a private/loopback
        address. The returned `secret` is shown once and used to derive the
        persisted HMAC signing key.
      tags: [OutgoingWebhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
                display_name: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  url: { type: string }
                  display_name: { type: string, nullable: true }
                  secret: { type: string, description: "Shown once. Never persisted or returned again." }

  /admin/outgoing-webhooks/{id}:
    patch:
      operationId: updateAdminOutgoingWebhook
      summary: Update an outgoing webhook's URL, name, or active state (admin)
      tags: [OutgoingWebhooks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string }
                display_name: { type: string }
                active: { type: boolean }
      responses:
        "200":
          description: OK
    delete:
      operationId: deleteAdminOutgoingWebhook
      summary: Delete an outgoing webhook (admin)
      tags: [OutgoingWebhooks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: No content

  /admin/outgoing-webhooks/{id}/subscriptions:
    get:
      operationId: listAdminOutgoingWebhookSubscriptions
      summary: List an outgoing webhook's event subscriptions (admin)
      tags: [OutgoingWebhooks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
                    items:
                      type: object
                      properties:
                        event: { type: string }
                        channels:
                          type: array
                          items: { type: string }
                          nullable: true
    put:
      operationId: setAdminOutgoingWebhookSubscriptions
      summary: Replace an outgoing webhook's event subscriptions (admin)
      description: "`message.*` events (other than `message.mention_bot`) require an explicit `channels` list."
      tags: [OutgoingWebhooks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscriptions]
              properties:
                subscriptions: { type: array, items: { $ref: '#/components/schemas/WebhookSubscriptionDto' } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, format: int64 }

  /admin/outgoing-webhooks/{id}/rotate-secret:
    post:
      operationId: rotateAdminOutgoingWebhookSecret
      summary: Rotate an outgoing webhook's signing secret (admin)
      tags: [OutgoingWebhooks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string, description: "Shown once. Never persisted or returned again." }

  /admin/outgoing-webhooks/{id}/enable:
    post:
      operationId: enableAdminOutgoingWebhook
      summary: Re-enable a disabled outgoing webhook and reset its failure count (admin)
      tags: [OutgoingWebhooks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK

  /admin/outgoing-webhooks/{id}/deliveries:
    get:
      operationId: listAdminOutgoingWebhookDeliveries
      summary: List recent delivery attempts for an outgoing webhook (admin)
      tags: [OutgoingWebhooks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, format: int64, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, format: int64, default: 0 }
        - name: event_type
          in: query
          schema: { type: string }
        - name: success
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    webhook_id: { type: string }
                    event_type: { type: string }
                    event_seq: { type: integer, format: int64, nullable: true }
                    attempted_at: { type: integer, format: int64 }
                    attempt_number: { type: integer, format: int64 }
                    status_code: { type: integer, format: int64, nullable: true }
                    success: { type: boolean }
                    error_msg: { type: string, nullable: true }

  # ── Voice and video over HTTP (clients with no socket) ────────────────────

  /voice/leave:
    delete:
      operationId: leaveVoice
      summary: Leave a voice channel
      description: >
        Removes the calling identity from the channel through the same cleanup
        as a WebSocket voice disconnect, for a client (typically an app) that
        has no socket to drop. Idempotent — calling when not in the channel is
        a no-op and still answers 204.
      tags: [Apps]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_id]
              properties:
                channel_id: { type: string }
      responses:
        "204": { description: "Left the channel, or was not in it" }

  /screenshare/start:
    post:
      operationId: startScreenshare
      summary: Register a video stream in a channel
      description: >
        Registers a new screen-share stream for the calling identity and
        broadcasts `screen_share_started` to all channel subscribers, for a
        client (typically an app) that pushes frames without the WS start
        handshake. After this call the caller pushes `screen_share_chunk`
        binary envelopes over its WS connection using the returned
        `stream_id`. Requires `voice.join` in the channel; streams started
        this way count against a hub-wide budget.
      tags: [Apps]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_id]
              properties:
                channel_id: { type: string }
                kind: { type: string, default: screen, description: "e.g. screen, webcam, video" }
                mime: { type: string, default: video/webm }
                has_audio: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  stream_id: { type: string }
                  channel_id: { type: string }
        "403": { description: Caller lacks voice.join in this channel }
        "404": { description: Channel not found }
        "429": { description: Hub-wide video stream budget exceeded }

  /screenshare/stop:
    delete:
      operationId: stopScreenshare
      summary: Stop a previously started video stream
      description: >
        Deregisters the caller's stream and broadcasts `screen_share_stopped`
        to all channel subscribers. Notifies any cross-channel subscribers
        that their subscription ended. Idempotent — safe to call if the stream
        is already gone.
      tags: [Apps]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_id, stream_id]
              properties:
                channel_id: { type: string }
                stream_id: { type: string }
      responses:
        "204": { description: No content — idempotent if stream already gone }

  # ── Group DM membership / sender keys ─────────────────────────────────────

  /conversations/{conversation_id}/members:
    post:
      operationId: createConversationMember
      summary: Add a member to a group conversation (members only; not 1-on-1 DMs)
      tags: [DMs]
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key]
              properties:
                public_key: { type: string }
                signed: { $ref: '#/components/schemas/SignedMemberChange' }
      responses:
        "204":
          description: No content

  /conversations/{conversation_id}/members/{pubkey}:
    delete:
      operationId: deleteConversationMember
      summary: Leave a group conversation (callers may only remove themselves)
      tags: [DMs]
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string }
        - name: pubkey
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignedMemberChange"
      responses:
        "204":
          description: No content

  /conversations/{conversation_id}/sender-keys:
    get:
      operationId: listConversationSenderKeys
      summary: Fetch wrapped group sender keys addressed to the caller
      tags: [DMs]
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    sender_pubkey: { type: string }
                    sender_key_version: { type: integer, format: int64 }
                    iteration: { type: integer, format: int64 }
                    wrapped_key_hex: { type: string }
                    wrap_nonce_hex: { type: string }
                    created_at: { type: integer, format: int64 }
    put:
      operationId: setConversationSenderKeys
      summary: Distribute the caller's group sender key (group conversations only)
      tags: [DMs]
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sender_key_version, recipients, signature_hex]
              properties:
                sender_key_version: { type: integer }
                recipients: { type: array, items: { $ref: '#/components/schemas/SenderKeyRecipientBlob' } }
                signature_hex: { type: string, description: Ed25519 signature over canonical bytes }
                signer_cert:
                  allOf: [{ $ref: '#/components/schemas/SubkeyCert' }]
                  description: >-
                    Present when a paired device's subkey signed the distribution. The signature is
                    then checked against signer_cert.subkey_pubkey, and the cert's master against
                    the authenticated session. Absent means the canonical key signed for itself.
      responses:
        "204":
          description: No content

  # ── DM block set ──────────────────────────────────────────────────────────

  /identity/dm-blocks:
    get:
      operationId: listIdentityDmBlocks
      summary: Get the caller's DM-block set
      tags: [Identity]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pubkeys: { type: array, items: { type: string } }
    put:
      operationId: setIdentityDmBlocks
      summary: Replace the caller's DM-block set
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pubkeys]
              properties:
                pubkeys: { type: array, items: { type: string } }
      responses:
        "200":
          description: OK

  # ── Alliances (hub-to-hub join + push invite) ─────────────────────────────

  /alliances/{alliance_id}/join:
    post:
      operationId: federationJoinAlliance
      summary: Remote hub joins an alliance with an invite token
      description: >-
        Hub-to-hub, with the joining hub's peer session (`is_hub`
        authentication). The invite token is single-use and expires after
        seven days; hub_url must answer for the authenticated key. Answers
        with a voucher the new member presents to the other members
        (`POST /federation/alliance-member`).
      tags: [Alliances]
      parameters:
        - name: alliance_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_token, hub_url]
              properties:
                invite_token: { type: string }
                hub_url: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  voucher: { type: string }

  /alliances/{alliance_id}/push-invite:
    post:
      operationId: createAlliancePushInvite
      summary: Push a direct alliance invite to another hub (alliance manager)
      tags: [Alliances]
      parameters:
        - name: alliance_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_hub_url, own_hub_url]
              properties:
                target_hub_url: { type: string }
                own_hub_url: { type: string }
                message: { type: string, nullable: true }
      responses:
        "200":
          description: OK

  # ── Join links ────────────────────────────────────────────────────────────

  /join/{code}:
    get:
      operationId: getJoinInvite
      summary: Preview an invite (public)
      security: []
      tags: [Invites]
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  hub_name: { type: string }
                  member_count: { type: integer, format: int64 }
                  code: { type: string }
        "404":
          description: Invite not found
        "410":
          description: Invite expired or fully used
    post:
      operationId: redeemJoinInvite
      summary: Redeem an invite (requires session token)
      description: Increments the invite's use count and auto-approves the caller, bypassing the approval queue.
      tags: [Invites]
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Joined
        "410":
          description: Invite expired or fully used

  # ── User profiles ─────────────────────────────────────────────────────────

  /users/{pubkey}/profile:
    get:
      operationId: getUserProfile
      summary: Get a user's hub profile (roles + badges)
      tags: [Users]
      parameters:
        - name: pubkey
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  public_key: { type: string }
                  display_name: { type: string, nullable: true }
                  avatar: { type: string, nullable: true }
                  joined_at: { type: integer, format: int64 }
                  roles:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        color: { type: string, nullable: true }
                  badges:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        label: { type: string }

  # ── Federation (discovery + ban list) ─────────────────────────────────────

  /federation/listing:
    get:
      operationId: getFederationListing
      summary: Hub discovery metadata (public)
      description: Always returns 200 with all fields, even when `listed` is false, so clients can probe any hub URL.
      security: []
      tags: [Federation]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  description: { type: string, nullable: true }
                  public_key: { type: string }
                  hub_url: { type: string }
                  tags: { type: array, items: { type: string } }
                  member_count_approx: { type: integer, format: int64, description: "Rounded down to the nearest 10" }
                  listed: { type: boolean }

  /federation/banlist:
    get:
      operationId: getFederationBanlist
      summary: Signed export of this hub's ban list (public)
      description: >-
        Subscribing hubs poll this feed; the Ed25519 signature is the authority.
        Served only while the owner has `publish_banlist` on (off by default,
        `PATCH /admin/settings/banlist`); 404 otherwise.
      security: []
      tags: [Federation]
      responses:
        "404":
          description: This hub does not publish its ban list
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  payload:
                    type: object
                    properties:
                      issuer_pubkey: { type: string }
                      issued_at: { type: integer, format: int64 }
                      entries:
                        type: array
                        items:
                          type: object
                          properties:
                            master_pubkey: { type: string }
                            reason: { type: string, nullable: true }
                            added_at: { type: integer, format: int64 }
                  signature: { type: string }

