          schema: { type: string }
      responses:
        "200":
          description: OK
    post:
      operationId: createModerationMute
      summary: Mute a user (manage_users)
      tags: [Moderation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_public_key]
              properties:
                target_public_key: { type: string }
                reason: { type: string }
      responses:
        "201":
          description: Created

  /moderation/mutes/{target_key}:
    delete:
      operationId: deleteModerationMute
      summary: Unmute (manage_users)
      tags: [Moderation]
      parameters:
        - name: target_key
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: No content

  /moderation/timeout:
    post:
      operationId: timeoutUser
      summary: Timeout a user (manage_users)
      tags: [Moderation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_public_key, duration_seconds]
              properties:
                target_public_key: { type: string }
                reason: { type: string }
