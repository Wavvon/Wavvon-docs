  # ── Moderation ────────────────────────────────────────────────────────────

  /moderation/bans:
    get:
      operationId: listModerationBans
      summary: List bans (moderation.ban.permanent)
      description: >-
        Newest first, paged only on hubs advertising `list.cursor.lists`.


        Expired bans are still listed: the row is the record of what was
        decided, and `expires_at` in the past is how a client tells a lapsed
        ban from a live one. Admission stops being refused the moment it
        passes, with no sweep in between.
      tags: [Moderation]
      parameters:
        - name: limit
          in: query
          description: Page size, clamped to 1..500.
          schema: { type: integer, format: int64, default: 100, minimum: 1, maximum: 500 }
        - name: cursor
          in: query
          description: Keyset cursor — the `target_public_key` of the previous page's last row.
          schema: { type: string }
      responses:
        "200":
          description: OK
    post:
      operationId: createModerationBan
      summary: Ban a user (moderation.ban.temporary or .permanent)
      description: >-
        Which permission this needs is decided by the request, not the route.
        `duration_seconds` present needs `moderation.ban.temporary`; absent
        needs `moderation.ban.permanent`. They are split by irreversibility —
        an hour is a cooling-off period, forever ends a membership — so a
        moderator trusted with the first is not thereby trusted with the
        second.


        Both still require out-ranking the target.
      tags: [Moderation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_public_key]
              properties:
                target_public_key: { type: string }
                reason: { type: string }
                duration_seconds:
                  type: integer
                  format: int64
                  description: >-
                    Omit for a permanent ban. Zero is refused rather than treated as permanent: it
                    would read as `expires_at: null` everywhere downstream, which is the opposite of
                    what a caller asking for a duration meant.
                  minimum: 1
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  target_public_key: { type: string }
                  banned_by: { type: string }
                  reason: { type: string, nullable: true }
                  expires_at:
                    type: integer
                    format: int64
                    nullable: true
                    description: Unix seconds; null for a permanent ban.
                  created_at: { type: integer, format: int64 }
        "400":
          description: "`duration_seconds` was zero."
        "403":
          description: >-
            The caller lacks the permission this request shape needs, or does
            not out-rank the target.

  /moderation/bans/{target_key}:
    delete:
      operationId: deleteModerationBan
      summary: Unban (moderation.ban.permanent)
      description: >-
        Lifts either kind. It stays on the permanent permission because
        removing a ban is never the escalation the split guards against.
      tags: [Moderation]
      parameters:
        - name: target_key
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: No content

  /moderation/mutes:
    get:
      operationId: listModerationMutes
      summary: List mutes (manage_users)
      description: Newest first. Paged only on hubs advertising `list.cursor.lists`.
      tags: [Moderation]
      parameters:
        - name: limit
          in: query
          description: Page size, clamped to 1..500.
          schema: { type: integer, format: int64, default: 100, minimum: 1, maximum: 500 }
        - name: cursor
          in: query
